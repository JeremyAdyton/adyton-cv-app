services:
  - type: web
    name: adyton-cv-app
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false   # À renseigner manuellement dans le dashboard Render
    plan: free
